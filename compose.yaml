services:
  app:
    build: .
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ":80"
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "mysql://app:${DB_PASSWORD}@database:3306/assiduo?serverVersion=mariadb-11.4.13&charset=utf8mb4"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mariadb:11.4.13
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_uca1400_ai_ci
    environment:
      MARIADB_DATABASE: assiduo
      MARIADB_USER: app
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
